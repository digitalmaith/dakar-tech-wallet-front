<div class="fixed bottom-6 right-6 z-[60] flex flex-col gap-3 max-w-sm w-full pointer-events-none">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex items-start gap-3 p-4 rounded-2xl shadow-xl border transition-all duration-300"
      [class.bg-surface]="true"
      [class.dark:bg-surface-dark]="true"
      [class.border-green-500/30]="toast.type === 'success'"
      [class.border-coral/30]="toast.type === 'error'"
      [class.border-ink/10]="toast.type === 'info'"
      [class.dark:border-white/10]="toast.type === 'info'">

      <div
        class="w-8 h-8 rounded-xl flex items-center justify-center shrink-0"
        [class.bg-green-500/10]="toast.type === 'success'"
        [class.bg-coral/10]="toast.type === 'error'"
        [class.bg-gold-500/10]="toast.type === 'info'">
        @switch (toast.type) {
          @case ('success') {
            <svg class="w-4 h-4 text-green-600 dark:text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          }
          @case ('error') {
            <svg class="w-4 h-4 text-coral" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
            </svg>
          }
          @default {
            <svg class="w-4 h-4 text-gold-600 dark:text-gold-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          }
        }
      </div>

      <p class="flex-1 text-sm text-ink dark:text-white pt-1">{{ toast.message }}</p>

      <button (click)="toastService.dismiss(toast.id)" class="text-ink/30 dark:text-white/30 hover:text-ink dark:hover:text-white transition-colors shrink-0">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  }
</div>
