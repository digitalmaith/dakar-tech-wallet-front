@if (dialogService.request(); as req) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-ink/40 dark:bg-black/60 backdrop-blur-sm"
    (click)="dialogService.respond(false)">

    <div
      (click)="$event.stopPropagation()"
      class="w-full max-w-sm bg-surface dark:bg-surface-dark rounded-2xl shadow-2xl border border-ink/10 dark:border-white/10 p-6 transition-colors duration-300">

      <div
        class="w-11 h-11 rounded-xl flex items-center justify-center mb-4"
        [class.bg-coral/10]="req.danger"
        [class.bg-gold-500/10]="!req.danger">
        @if (req.danger) {
          <svg class="w-5 h-5 text-coral" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
          </svg>
        } @else {
          <svg class="w-5 h-5 text-gold-600 dark:text-gold-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        }
      </div>

      <h2 class="font-display text-lg font-semibold text-ink dark:text-white mb-2">{{ req.title }}</h2>
      <p class="text-sm text-ink/60 dark:text-white/60 mb-6">{{ req.message }}</p>

      <div class="flex gap-3">
        <button
          type="button"
          (click)="dialogService.respond(false)"
          class="flex-1 px-4 py-2.5 rounded-xl border border-ink/10 dark:border-white/10 text-ink/70 dark:text-white/70 text-sm font-medium hover:bg-ink/5 dark:hover:bg-white/5 transition">
          {{ req.cancelLabel }}
        </button>
        <button
          type="button"
          (click)="dialogService.respond(true)"
          class="flex-1 px-4 py-2.5 rounded-xl text-sm font-bold transition"
          [class.bg-coral]="req.danger"
          [class.text-white]="req.danger"
          [class.hover:bg-coral/90]="req.danger"
          [class.bg-gradient-to-r]="!req.danger"
          [class.from-gold-500]="!req.danger"
          [class.to-gold-400]="!req.danger"
          [class.text-ink]="!req.danger">
          {{ req.confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
